# Lint and test on every push and pull request — torch-free by design.
#
# The package's runtime dependency is easyocr, which drags torch; CI does
# not install the package at all. The tests are written to run from the
# source tree (they read the packaged yaml and source as files), and the
# easyocr-dependent ones guard with importorskip and are exercised
# locally instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling only
        run: pip install pytest ruff pyyaml

      # uv.lock pins the full resolved dependency tree (easyocr, torch and
      # all) so scanners see real versions, not ranges — resolving needs no
      # installing, so this stays torch-free. The lock is universal, so
      # checking it on Linux validates what was written on a Mac.
      # Regenerate with `uv lock` after any pyproject.toml change.
      - name: Lockfile is current
        run: |
          pip install --quiet uv
          uv lock --check

      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools

      - name: Test
        run: pytest

  # Same arrangement as Tetrak and scattercode.dev. The committed uv.lock is
  # what makes the scan worthwhile for Python: pyproject.toml declares ranges,
  # but the lock carries every resolved version, so known CVEs in transitive
  # dependencies surface here rather than in a user's install.
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library
          severity: HIGH,CRITICAL

      # A source-tree SBOM. Because uv.lock is committed, this resolves the
      # full Python dependency tree — unlike a bare pyproject.toml scan.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-source-tree
          path: sbom.cdx.json
          retention-days: 90
